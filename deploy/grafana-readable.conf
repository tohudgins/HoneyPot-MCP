# systemd drop-in: let the Grafana dashboards read the SQLite database.
#
# Install with:
#   sudo mkdir -p /etc/systemd/system/honeypot-mcp.service.d
#   sudo cp deploy/grafana-readable.conf /etc/systemd/system/honeypot-mcp.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart honeypot-mcp
#
# The base unit runs with UMask=0077, so the database is created 0600 and nothing
# but the service user can read it. That is right until you run the dashboards on
# the host's database: Grafana is a container and needs *read* access. With
# UMask=0027 files are created 0640 (owner rw, group r) and directories 0750.
# Combined with a setgid data directory owned by a dedicated `honeypot-db` group
# (docs/DEPLOY.md step 9), exactly that group — which only the Grafana container
# is given — can read the database, and no one else gains anything.
#
# Private key material is unaffected: TLS keys, generated honeytoken keys and packet
# captures are created 0600 explicitly, whatever the umask is.
[Service]
UMask=0027

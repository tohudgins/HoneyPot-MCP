[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "honeypot-mcp"
version = "0.2.0"
description = "Deception infrastructure you drive by talking to it — 14-protocol honeypots, honeytokens and attacker analysis over MCP"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "tohudgins" }]
keywords = [
    "honeypot",
    "honeytoken",
    "deception",
    "security",
    "threat-intelligence",
    "mcp",
    "model-context-protocol",
    "soc",
    "blue-team",
    "mitre-attack",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]

dependencies = [
    # MCP
    "fastmcp>=2.0.0",
    # Web / async
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    # Docker
    "docker>=7.1.0",
    # AWS — used by tools/blocklist_push.py for WAFv2 IPSet updates.
    # Optional in practice (the WAF tool gates the import), but pinning it
    # in deps makes the blocklist-push feature work out of the box.
    "boto3>=1.34.0",
    # Threat intel
    "geoip2>=4.8.0",
    # Honeypot protocols
    "pyftpdlib>=1.5.9",
    "dnslib>=0.9.24",
    # TLS (self-signed cert generation for HTTPS + SMTP STARTTLS)
    "cryptography>=42.0.0",
    # Honeytoken file embedding
    "reportlab>=4.2.0",
    "python-docx>=1.1.0",
    # Report generation
    "jinja2>=3.1.0",
    # Config
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    # Utilities
    "rich>=13.7.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
# PostgreSQL support. The docs offer swapping DATABASE_URL to Postgres as the
# production path, which needs a driver SQLAlchemy can import — without this
# extra that swap fails at startup with ModuleNotFoundError: asyncpg.
postgres = [
    "asyncpg>=0.29.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    # So `pytest` can exercise the Postgres path in CI.
    "asyncpg>=0.29.0",
]

[project.urls]
Homepage = "https://github.com/tohudgins/HoneyPot-MCP"
Repository = "https://github.com/tohudgins/HoneyPot-MCP"
Changelog = "https://github.com/tohudgins/HoneyPot-MCP/blob/main/CHANGELOG.md"
Issues = "https://github.com/tohudgins/HoneyPot-MCP/issues"
"Known Limitations" = "https://github.com/tohudgins/HoneyPot-MCP/blob/main/KNOWN_LIMITATIONS.md"
Security = "https://github.com/tohudgins/HoneyPot-MCP/blob/main/SECURITY.md"

[project.scripts]
honeypot-mcp = "honeypot_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/honeypot_mcp"]
# The console's HTML asset is data, not a module — hatch would otherwise skip it
# and the wheel would serve a 500 for the dashboard.
artifacts = [
    "src/honeypot_mcp/console/static/*",
    "src/honeypot_mcp/presets/*.yaml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Line length is enforced by `ruff format`, not lint. Tests have intentionally
# long assertion strings, and intel/mitre.py has long technique descriptions.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The (str, enum.Enum) pattern is intentional — SQLAlchemy stores the .value
# when columns are typed Enum(...), and isinstance(member, str) returns True
# so direct string comparisons keep working. Switching to StrEnum would
# change str(member) output and break serialisation.
"src/honeypot_mcp/storage/models.py" = ["UP042"]
# Default implementations on the ABC are intentional — engines that don't
# need pause/resume (in-process asyncio servers) inherit the no-op.
"src/honeypot_mcp/engines/base.py" = ["B027"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Strict mypy is aspirational here — we enforce the high-signal checks below
# instead. Tighten over time.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_reexport = false
check_untyped_defs = false
# CI-blocking subset:
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_any_generics = false

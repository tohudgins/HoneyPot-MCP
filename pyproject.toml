[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "honeypot-mcp"
version = "0.1.0"
description = "MCP server for deploying and managing honeypots, honeytokens, and attack analysis"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    # MCP
    "fastmcp>=2.0.0",
    # Web / async
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    # Docker
    "docker>=7.1.0",
    # Threat intel
    "geoip2>=4.8.0",
    # Honeypot protocols
    "pyftpdlib>=1.5.9",
    "dnslib>=0.9.24",
    # Honeytoken file embedding
    "reportlab>=4.2.0",
    "python-docx>=1.1.0",
    # Report generation
    "jinja2>=3.1.0",
    # Config
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    # Utilities
    "rich>=13.7.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
honeypot-mcp = "honeypot_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/honeypot_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

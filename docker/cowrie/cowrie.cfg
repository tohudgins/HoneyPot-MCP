[honeypot]
# Defaults — overridden per-deploy by COWRIE_HONEYPOT_* env vars from the engine
# (see engines/ssh_personas.py). Hostname / kernel will be replaced at start time.
hostname = ubuntu-server
kernel_build_string = #91-Ubuntu SMP Mon Aug 14 12:51:52 UTC 2023
kernel_version = 5.15.0-91-generic
hardware_platform = x86_64
operating_system = GNU/Linux

# Random auth — accept some, reject some, capture all attempts.
# (1 success in N tries means attackers actually log in sometimes and
# generate post-login command alerts, which is the interesting part.)
auth_class = AuthRandom
auth_class_parameters = 1, 1, 10

[ssh]
# Default OpenSSH banner — overridden per-deploy by COWRIE_SSH_VERSION.
# Attackers fingerprint heavily on this string, so the engine pins it
# to match the chosen distro persona (engines/ssh_personas.py).
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.4

# Output options
[output_jsonlog]
enabled = true
logfile = var/log/cowrie/cowrie.json

[output_textlog]
enabled = true
logfile = var/log/cowrie/cowrie.log

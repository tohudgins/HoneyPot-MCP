version: "3.9"

services:
  # ── MCP Server ───────────────────────────────────────────────────────────────
  honeypot-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    container_name: honeypot-mcp-server
    restart: unless-stopped
    volumes:
      - ../honeypot_mcp.db:/app/honeypot_mcp.db
      - ../config:/app/config:ro
      - ../reports:/app/reports
      - /var/run/docker.sock:/var/run/docker.sock  # Docker-in-Docker for managing honeypots
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/honeypot_mcp.db
      - CANARY_PUBLIC_URL=${CANARY_PUBLIC_URL:-http://localhost:8888}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8888:8888"   # Canary callback server
    networks:
      - honeypot-net
    labels:
      - "honeypot-mcp=server"

  # ── SSH Honeypot (Cowrie) ─────────────────────────────────────────────────
  cowrie-ssh:
    image: cowrie/cowrie:latest
    container_name: honeypot-ssh
    restart: unless-stopped
    ports:
      - "${DEFAULT_SSH_PORT:-2222}:2222"
    environment:
      - COWRIE_HOSTNAME=ubuntu-server
    volumes:
      - cowrie-logs:/cowrie/var/log/cowrie
    networks:
      - honeypot-net
    labels:
      - "honeypot-mcp=true"
      - "honeypot-name=cowrie-ssh"

  # ── HTTP Honeypot ─────────────────────────────────────────────────────────
  http-honeypot:
    build:
      context: ./http-honeypot
    container_name: honeypot-http
    restart: unless-stopped
    ports:
      - "${DEFAULT_HTTP_PORT:-8080}:8080"
    networks:
      - honeypot-net
    labels:
      - "honeypot-mcp=true"
      - "honeypot-name=http-honeypot"

volumes:
  cowrie-logs:

networks:
  honeypot-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

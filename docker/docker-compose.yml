# All-in-one DEMO / self-contained stack: MCP server + static Cowrie & HTTP
# honeypots + Prometheus + Grafana, on one internal network. Best for a laptop
# demo, dashboards, and screenshots (`scripts/seed_demo_data.py`).
#
# NOT the path for driving honeypots via natural language on a public host —
# the honeypot-mcp container here runs the background services but is not a
# networked MCP endpoint a client can attach to, and dynamically-deployed
# in-process honeypots wouldn't have their ports published. For that, run the
# server as a persistent HTTP daemon on the host (deploy/honeypot-mcp.service)
# and use docker-compose.observability.yml for the dashboards. See docs/DEPLOY.md.
services:
  # ── Docker socket proxy ─────────────────────────────────────────────────────
  # The MCP server uses Docker to manage Cowrie containers. Mounting
  # /var/run/docker.sock into it directly would hand the full Docker API to a
  # process that parses untrusted attacker payloads all day.
  #
  # The proxy narrows that to a whitelist of API *endpoints* over TCP:
  #   CONTAINERS=1  list / inspect / create / start / stop / remove / logs
  #   IMAGES=1      get / pull (needed for first-run Cowrie image pull)
  #   POST=1        allow POST verbs (create/start/stop)
  # Everything else (networks, volumes, secrets, system, exec, swarm) is off.
  #
  # What this does NOT do — be clear-eyed about it: the proxy filters by URL
  # path and HTTP verb, never by request body. `POST /containers/create` is
  # allowed, and a create body can say `Privileged: true` or bind-mount `/`,
  # which is root on the host. The `:ro` on the socket mount below only
  # protects the socket *file*; it does not restrict the API. So anything that
  # can reach socket-proxy:2375 is effectively root on the host.
  #
  # The real control is therefore *who can reach the proxy*: it sits alone on
  # the `internal: true` control-net with the MCP server, and no honeypot,
  # Grafana or Prometheus container joins that network. If you do not need
  # dynamically-managed Cowrie containers at all, delete this service and the
  # DOCKER_HOST variable and the host socket is never exposed.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    container_name: honeypot-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      # Defensive defaults: deny every endpoint the SSH engine doesn't touch.
      # tecnativa/docker-socket-proxy defaults these off, but listing them
      # explicitly makes the threat model legible to future maintainers.
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 0
      EXEC: 0
      GRPC: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - control-net
    # NOT read_only: the entrypoint renders /usr/local/etc/haproxy/haproxy.cfg
    # from the env vars above at every boot, and that directory also holds the
    # image's own haproxy.cfg.template — so it can be neither read-only nor
    # masked by a tmpfs. The hardening that matters for this sidecar is the
    # restricted API surface above (it can only reach container + image
    # endpoints) plus no-new-privileges; a read-only rootfs would add little
    # on top of that and costs a crash loop.
    tmpfs:
      - /run
    security_opt:
      - no-new-privileges:true

  # ── MCP Server ───────────────────────────────────────────────────────────────
  honeypot-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    image: honeypot-mcp:local
    container_name: honeypot-mcp-server
    restart: unless-stopped
    depends_on:
      - socket-proxy
    volumes:
      - mcp-data:/app/data
      - mcp-reports:/app/reports
      - mcp-tls:/app/tls
      # Optional: drop a GeoLite2-City.mmdb into ./geoip on the host (sibling of
      # this compose file) and `GEOIP_DB_PATH=/app/geoip/GeoLite2-City.mmdb` will
      # pick it up. MaxMind's license forbids redistribution, so the DB is NOT
      # baked into the image — download it yourself with a free MaxMind account.
      - ./geoip:/app/geoip:ro
    environment:
      # Collector mode: run the capture plane (canary callbacks, watchdog,
      # webhook delivery, /metrics) with no MCP control plane. A detached
      # container has no stdin, so the default stdio transport would read EOF
      # and exit immediately, restart-looping forever.
      MCP_TRANSPORT: none
      # Talk to Docker via the proxy, not /var/run/docker.sock directly.
      DOCKER_HOST: tcp://socket-proxy:2375
      DATABASE_URL: sqlite+aiosqlite:////app/data/honeypot_mcp.db
      CANARY_PUBLIC_URL: ${CANARY_PUBLIC_URL:-http://localhost:8888}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: "9090"
      CANARY_CALLBACK_HOST: 0.0.0.0
      CANARY_CALLBACK_PORT: "8888"
      # Live operations console. Binds 0.0.0.0 *inside* the container; the
      # published port below keeps it on the host's loopback, because the
      # console shows every captured attack.
      CONSOLE_HOST: 0.0.0.0
      CONSOLE_PORT: "8090"
      GEOIP_DB_PATH: /app/geoip/GeoLite2-City.mmdb
      # Optional second database: origin AS number + org — the key pivot for
      # spotting hosting/VPN/botnet networks. Same MaxMind account, same drop
      # into ./geoip. Must be set explicitly: inside the container the code's
      # default path resolves relative to the installed package, not /app.
      GEOIP_ASN_DB_PATH: /app/geoip/GeoLite2-ASN.mmdb
      # Packet capture. Off here on purpose: inside this compose network the
      # container sees only bridge traffic, so a capture would record the
      # NAT'd view rather than the attacker's real source addresses. To use it,
      # run the server on the host (deploy/honeypot-mcp.service) where the
      # interface is the real one — or add `network_mode: host` plus
      # `cap_add: [NET_ADMIN, NET_RAW]` to this service and set PCAP_ENABLED
      # here. tcpdump is already in the image.
      PCAP_ENABLED: "${PCAP_ENABLED:-false}"
    ports:
      - "8888:8888"   # Canary callback server (publicly reachable)
      - "127.0.0.1:8090:8090"   # Live console — localhost only
      - "127.0.0.1:9090:9090"   # Prometheus /metrics — bound to localhost only
      # The in-process honeypots the demo seeds (SMTP/FTP/RDP) listen inside
      # this container. Without publishing them they are unreachable from
      # anywhere but the container itself, so the only traffic they ever saw
      # was the watchdog's own health probe — honeypots that cannot be
      # attacked. Published on 0.0.0.0 deliberately: being reachable is the
      # entire point of a honeypot. Restrict to 127.0.0.1 if you only want
      # them exercised locally.
      - "2525:2525"   # demo-smtp
      - "2121:2121"   # demo-ftp
      - "3389:3389"   # demo-rdp
    networks:
      - honeypot-net
      - monitor-net
      - control-net
    labels:
      - "honeypot-mcp=server"
    # Readiness, not liveness. A honeypot whose database has gone away keeps
    # answering attackers perfectly — the listeners are in-process and do not
    # need the DB — while every captured event silently fails to persist. Only
    # a probe that actually queries a table can tell "running" from
    # "collecting", and collecting is the only thing that matters for a sensor.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen(
              "http://127.0.0.1:9090/readyz", timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  # ── SSH Honeypot (Cowrie) ─────────────────────────────────────────────────
  cowrie-ssh:
    # Pinned to a release tag (keep in step with COWRIE_IMAGE in
    # src/honeypot_mcp/engines/ssh.py).
    image: cowrie/cowrie:3.0.15
    container_name: honeypot-ssh
    restart: unless-stopped
    ports:
      - "${DEFAULT_SSH_PORT:-2222}:2222"
    environment:
      - COWRIE_HOSTNAME=ubuntu-server
      # Cowrie's JSON event stream has to reach stdout for the MCP server to
      # ingest it — see the note in engines/ssh_personas.py:cowrie_env_vars.
      # `plain` is required alongside the path: the default `rotating` logtype
      # seeks on open, which a pipe rejects.
      - COWRIE_HONEYPOT_LOGTYPE=plain
      - COWRIE_OUTPUT_JSONLOG_ENABLED=true
      - COWRIE_OUTPUT_JSONLOG_LOGFILE=/proc/self/fd/1
    volumes:
      - cowrie-logs:/cowrie/var/log/cowrie
    networks:
      - honeypot-net
    labels:
      - "honeypot-mcp=true"
      - "honeypot-name=cowrie-ssh"
    # Attacker-facing: an interactive emulator the attacker drives. Cowrie
    # listens on unprivileged ports (2222/2223) so it needs no capabilities.
    # read_only is deliberately NOT set: Cowrie writes under /cowrie/var
    # (downloads, tty logs, state) and the image has no documented set of
    # writable paths to tmpfs, so an immutable rootfs would risk a crash loop.
    mem_limit: 256m
    pids_limit: 128
    cpus: 0.5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The JSON event stream is on stdout, so the json-file log is the evidence
    # channel — and unbounded by default.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── HTTP Honeypot ─────────────────────────────────────────────────────────
  http-honeypot:
    build:
      context: ./http-honeypot
    container_name: honeypot-http
    restart: unless-stopped
    ports:
      - "${DEFAULT_HTTP_PORT:-8080}:8080"
    networks:
      - honeypot-net
    labels:
      - "honeypot-mcp=true"
      - "honeypot-name=http-honeypot"
    # Attacker-facing: bounded, unprivileged, immutable rootfs. The server
    # needs no writable path and listens on an unprivileged port.
    mem_limit: 128m
    pids_limit: 64
    cpus: 0.25
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Prometheus (scrapes /metrics) ──────────────────────────────────────────
  # Bound to localhost only — same as the MCP /metrics endpoint. SSH-tunnel
  # to reach it from another host. Prometheus itself doesn't need to be
  # internet-reachable for the dashboards to work.
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: honeypot-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "127.0.0.1:9091:9090"
    networks:
      - monitor-net
    security_opt:
      - no-new-privileges:true

  # ── Grafana (provisioned dashboards) ───────────────────────────────────────
  # The visual front door. Provisions Prometheus + SQLite datasources and
  # auto-loads dashboards from grafana/dashboards/. Mounts the MCP data
  # volume read-only so SQLite-backed panels (geo map, top attackers) can
  # query the live alerts table. WAL mode (database.py) means these reads
  # don't lock the MCP writer.
  grafana:
    image: grafana/grafana:11.3.0
    container_name: honeypot-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Anonymous access is OFF by default: this Grafana can query the whole
      # SQLite DB (captured credentials, honeytoken values, API-key hashes,
      # webhook secrets). Opt in with GRAFANA_ANONYMOUS_ENABLED=true only for a
      # throwaway demo that holds no real data.
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS_ENABLED:-false}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      # No default password: set GRAFANA_ADMIN_PASSWORD in .env.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # The dashboards' SQLite panels need the frser-sqlite-datasource plugin;
      # it is a community plugin and Grafana only loads it when allowed.
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: frser-sqlite-datasource
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      # Read-only access to the MCP SQLite DB. WAL mode lets us read while
      # MCP writes; mount is :ro because dashboards should never mutate.
      - mcp-data:/mcp-data:ro
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    networks:
      - monitor-net
    security_opt:
      - no-new-privileges:true

volumes:
  cowrie-logs:
  mcp-data:
  mcp-reports:
  mcp-tls:
  prometheus-data:
  grafana-data:

networks:
  # Attacker-facing: Cowrie and the HTTP honeypot live here. They share it with
  # the MCP server (which probes and ingests from them) and nothing else.
  honeypot-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  # Observability: Prometheus, Grafana and the MCP /metrics endpoint. Kept off
  # honeypot-net so a compromised decoy cannot reach Grafana's login page or
  # Prometheus. Not `internal` because Grafana's published port and plugin
  # install both need a routable network.
  monitor-net:
    driver: bridge
  # Control plane: the Docker socket proxy and its only client, the MCP server.
  # `internal: true` = no external routing; no honeypot, Grafana or Prometheus
  # container is attached, so none of them can even open a TCP connection to
  # the Docker API.
  control-net:
    driver: bridge
    internal: true

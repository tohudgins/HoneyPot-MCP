name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint (blocking)
        run: ruff check src/ tests/

      - name: Ruff format check (blocking)
        run: ruff format --check src/ tests/

      - name: Pytest with coverage (blocking — fails under 60%)
        env:
          # Force the in-memory DB regardless of any committed .env
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          pytest tests/unit/ -v \
            --cov=src/honeypot_mcp \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60 \
            --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: |
            pytest-results.xml
            coverage.xml
          if-no-files-found: ignore

  typecheck:
    name: typecheck (blocking)
    runs-on: ubuntu-latest
    # Mypy now blocks the badge. The codebase passes cleanly under the
    # current config — keep it that way. Loosening rules later is fine,
    # silent regressions aren't.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mypy
        run: mypy src/

  security-audit:
    name: dependency security audit
    runs-on: ubuntu-latest
    # Informational: surfaces CVEs in the dependency tree without blocking
    # the badge. A real exploit on a dep we depend on should get attention
    # but shouldn't gate every PR — flip to blocking once we have a process
    # for triaging false positives.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
          pip install pip-audit
      - name: pip-audit
        # --strict treats vulnerability resolution failures as errors so we
        # see them in the log; the job is non-blocking via continue-on-error.
        run: pip-audit --strict

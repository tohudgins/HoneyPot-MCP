name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege for the default GITHUB_TOKEN. Nothing in CI writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint (blocking)
        run: ruff check src/ tests/

      - name: Ruff format check (blocking)
        run: ruff format --check src/ tests/

      - name: Pytest with coverage (blocking — fails under 60%)
        env:
          # Force the in-memory DB regardless of any committed .env
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          pytest tests/unit/ -v \
            --cov=src/honeypot_mcp \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60 \
            --junitxml=pytest-results.xml

      - name: Integration tests (real sockets, full pipeline)
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: pytest tests/integration/ -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: |
            pytest-results.xml
            coverage.xml
          if-no-files-found: ignore

  postgres:
    name: postgres compatibility (blocking)
    runs-on: ubuntu-latest
    # The docs offer PostgreSQL as the production database. That claim went
    # untested for the project's whole life and was broken the entire time: an
    # over-length Alembic revision id is accepted by SQLite and rejected by
    # Postgres, so the migration chain died mid-way and init_db's create_all
    # fallback silently hid it — every restart re-ran every migration. Nothing
    # but a real Postgres catches that class of bug.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: honeypot
          POSTGRES_DB: honeypot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project + dev + postgres extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Migrations apply cleanly and stamp the version
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:honeypot@localhost:5432/honeypot_test
        run: |
          python - <<'PY'
          import asyncio, logging, sys
          problems = []
          class Catch(logging.Handler):
              def emit(self, record):
                  if "fallback" in record.getMessage().lower():
                      problems.append(record.getMessage())
          logging.getLogger().addHandler(Catch())
          logging.getLogger().setLevel(logging.WARNING)
          from honeypot_mcp.storage.database import init_db, close_db
          asyncio.run(init_db()); asyncio.run(close_db())
          if problems:
              sys.exit("init_db fell back to create_all on PostgreSQL: %s" % problems)
          print("migrations applied without fallback")
          PY

      - name: Re-running startup is a no-op (version stamp persisted)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:honeypot@localhost:5432/honeypot_test
        run: |
          python - <<'PY' 2>&1 | tee /tmp/second.log
          import asyncio, logging
          logging.basicConfig(level=logging.INFO, format="%(message)s")
          from honeypot_mcp.storage.database import init_db, close_db
          asyncio.run(init_db()); asyncio.run(close_db())
          PY
          if grep -q "Running upgrade" /tmp/second.log; then
            echo "::error::migrations re-ran on an already-migrated database — version stamp not persisted"
            exit 1
          fi
          echo "second startup was a no-op"

      - name: Full unit suite against PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:honeypot@localhost:5432/honeypot_test
        run: pytest tests/unit/ -q

  typecheck:
    name: typecheck (blocking)
    runs-on: ubuntu-latest
    # Mypy now blocks the badge. The codebase passes cleanly under the
    # current config — keep it that way. Loosening rules later is fine,
    # silent regressions aren't.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mypy
        run: mypy src/

  security-audit:
    name: dependency security audit (blocking)
    runs-on: ubuntu-latest
    # Blocking. Audits the *locked* runtime dependency set (uv.lock) — the exact
    # versions the Docker image installs — rather than whatever pip happens to
    # resolve today. The tree is currently clean; a new advisory fails the build,
    # which is the point: bump the floor in pyproject.toml and `uv lock
    # --upgrade-package <pkg>`. If an advisory is a verified false positive,
    # add a narrowly-scoped `--ignore-vuln <ID>` with the reasoning beside it.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install audit tooling
        run: python -m pip install --upgrade pip uv pip-audit
      - name: Export the lock and audit it
        # `--frozen` fails if uv.lock is stale relative to pyproject.toml.
        # --no-emit-project drops the local package (not on PyPI); --no-deps is
        # correct because the export is already fully resolved and hashed.
        run: |
          uv export --frozen --no-dev --no-emit-project --output-file /tmp/requirements.txt
          pip-audit --requirement /tmp/requirements.txt --no-deps --disable-pip

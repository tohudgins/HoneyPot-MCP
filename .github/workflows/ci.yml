name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint (blocking)
        run: ruff check src/ tests/

      - name: Ruff format check (blocking)
        run: ruff format --check src/ tests/

      - name: Pytest with coverage (blocking — fails under 60%)
        env:
          # Force the in-memory DB regardless of any committed .env
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          pytest tests/unit/ -v \
            --cov=src/honeypot_mcp \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60 \
            --junitxml=pytest-results.xml

      - name: Integration tests (real sockets, full pipeline)
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: pytest tests/integration/ -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: |
            pytest-results.xml
            coverage.xml
          if-no-files-found: ignore

  postgres:
    name: postgres compatibility (blocking)
    runs-on: ubuntu-latest
    # The docs offer PostgreSQL as the production database. That claim went
    # untested for the project's whole life and was broken the entire time: an
    # over-length Alembic revision id is accepted by SQLite and rejected by
    # Postgres, so the migration chain died mid-way and init_db's create_all
    # fallback silently hid it — every restart re-ran every migration. Nothing
    # but a real Postgres catches that class of bug.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: honeypot
          POSTGRES_DB: honeypot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project + dev + postgres extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Migrations apply cleanly and stamp the version
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:honeypot@localhost:5432/honeypot_test
        run: |
          python - <<'PY'
          import asyncio, logging, sys
          problems = []
          class Catch(logging.Handler):
              def emit(self, record):
                  if "fallback" in record.getMessage().lower():
                      problems.append(record.getMessage())
          logging.getLogger().addHandler(Catch())
          logging.getLogger().setLevel(logging.WARNING)
          from honeypot_mcp.storage.database import init_db, close_db
          asyncio.run(init_db()); asyncio.run(close_db())
          if problems:
              sys.exit("init_db fell back to create_all on PostgreSQL: %s" % problems)
          print("migrations applied without fallback")
          PY

      - name: Re-running startup is a no-op (version stamp persisted)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:honeypot@localhost:5432/honeypot_test
        run: |
          python - <<'PY' 2>&1 | tee /tmp/second.log
          import asyncio, logging
          logging.basicConfig(level=logging.INFO, format="%(message)s")
          from honeypot_mcp.storage.database import init_db, close_db
          asyncio.run(init_db()); asyncio.run(close_db())
          PY
          if grep -q "Running upgrade" /tmp/second.log; then
            echo "::error::migrations re-ran on an already-migrated database — version stamp not persisted"
            exit 1
          fi
          echo "second startup was a no-op"

      - name: Full unit suite against PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:honeypot@localhost:5432/honeypot_test
        run: pytest tests/unit/ -q

  typecheck:
    name: typecheck (blocking)
    runs-on: ubuntu-latest
    # Mypy now blocks the badge. The codebase passes cleanly under the
    # current config — keep it that way. Loosening rules later is fine,
    # silent regressions aren't.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mypy
        run: mypy src/

  security-audit:
    name: dependency security audit
    runs-on: ubuntu-latest
    # Informational: surfaces CVEs in the dependency tree without blocking
    # the badge. A real exploit on a dep we depend on should get attention
    # but shouldn't gate every PR — flip to blocking once we have a process
    # for triaging false positives.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
          pip install pip-audit
      - name: pip-audit
        # --skip-editable ignores the local honeypot-mcp install (not on PyPI).
        # We deliberately do NOT pass --strict: it would treat the editable skip
        # itself as a fatal resolution error, defeating the point of --skip-editable.
        # CVEs in real deps are still reported in the log; the job is non-blocking
        # via continue-on-error anyway.
        #
        # --ignore-vuln PYSEC-2025-183 — pyjwt "weak encryption" advisory.
        # Reasons:
        #  1. The advisory's `last_affected` is 2.10.1 (per the OSV record at
        #     https://osv.dev/vulnerability/PYSEC-2025-183). We pull in pyjwt
        #     2.12.1 transitively via fastmcp -> mcp; that's already past the
        #     affected range, so this is a pip-audit version-comparison false
        #     positive.
        #  2. The upstream maintainer disputes the underlying claim, arguing
        #     that key length is the responsibility of the calling application.
        #     There is no published fix version because the maintainer doesn't
        #     consider the issue a bug.
        #  3. We don't sign or verify JWTs with pyjwt — our jwt honeytoken
        #     provider (tokens/jwt.py) implements its own HS256 path using
        #     stdlib hmac + base64, so even if the advisory applied to us,
        #     our attack surface wouldn't be affected.
        # Re-evaluate this ignore if the advisory is updated to extend the
        # affected range past 2.10.1 OR if pyjwt publishes a fixed version.
        run: pip-audit --skip-editable --ignore-vuln PYSEC-2025-183

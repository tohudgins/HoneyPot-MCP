name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint (blocking)
        run: ruff check src/ tests/

      - name: Ruff format check (blocking)
        run: ruff format --check src/ tests/

      - name: Pytest with coverage (blocking)
        env:
          # Force the in-memory DB regardless of any committed .env
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          pytest tests/unit/ -v \
            --cov=src/honeypot_mcp \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: |
            pytest-results.xml
            coverage.xml
          if-no-files-found: ignore

  typecheck:
    name: typecheck (informational)
    runs-on: ubuntu-latest
    # mypy is run for visibility but does not block the badge yet — the
    # codebase still has ~30 untyped corners. Tighten over time, then flip
    # `continue-on-error` off once it's clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mypy
        run: mypy src/
